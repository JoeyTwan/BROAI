    <script>
      const root = document.documentElement;
      const toggleBtn = document.getElementById("themeToggle");
      const sunIcon = toggleBtn.querySelector(".sun-icon");
      const moonIcon = toggleBtn.querySelector(".moon-icon");
      const conversationList = document.getElementById("conversationList");
      const welcomeScreen = document.getElementById("welcomeScreen");
      const messageHistory = document.getElementById("messageHistory");
      const conversationTitle = document.getElementById("conversationTitle");
      const messageInput = document.querySelector("textarea");
      const sendForm = document.querySelector("form");
      
      // 通义千问（Dashscope）API 配置
      // ⚠️ 安全提示：前端代码中的密钥仍然可以被查看
      // 推荐：使用后端代理API调用，将密钥保存在服务器端
      // 配置来源：config.js（可通过window.ENV注入环境变量）
      // 详细说明请查看 SECURITY.md
      const OPENAI_API_KEY = window.APP_CONFIG?.OPENAI_API_KEY || "sk-7dfe8fcbb30e4f5493c1e9350c544114";
      const OPENAI_API_URL = window.APP_CONFIG?.OPENAI_API_URL || "https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions";
      const OPENAI_MODEL = window.APP_CONFIG?.OPENAI_MODEL || "qwen-plus";
      
      // 系统提示词
      const SYSTEM_PROMPT = `你是一个专业的需求澄清助手。当用户提出模糊需求时，你需要通过多轮对话了解真实需求。每次只问一个最关键的问题，直到收集到以下信息：
- 背景和用途
- 目标受众
- 具体格式要求
- 风格偏好
- 细节程度

当信息足够时，生成最终内容。`;

      const SAMPLE_REPORT_CONTENT = `OK，信息齐了。我会给你：
1. PPT 结构（6-7 页）
2. 中美市场对比表
3. 关键数据：总需求、客单、复购、政策节点
4. 风险提示 + 反驳话术

以下是完整调研稿，拿去怼投资人用吧：
---
《2025 情趣科技（智能情侣玩具）市场速拆》
• 赛道脉络：全球 142 亿美元市场，年复合 11.8%；国内体量 260 亿元，线上渗透率仅 32%，仍有 2 倍空间
• 主力人群：一二线 25-35 岁伴侣，女性决策 62%，接受订阅式私密服务
• 产品趋势：智能交互 + AI 体感，强调健康 & 情绪价值
• 中美对比：
  - 北美：高客单（人均 $185），复购 2.1 次/年，主打“健康+愉悦”叙事
  - 国内：客单 460 元，复购 1.4 次/年，增速更快（18% vs 9%）但品牌信任弱
• 商业亮点：
  1) 订阅配件提高 LTV（ARPU 可从 460 元拉到 980 元）
  2) 在线咨询 + 会员社群降低获客（CAC 预计 &lt;90 元）
  3) 隐私合规：本地加密 + 可验证删除，满足《数据出境安全评估》
• 风险 & 反驳：
  - “需求小众”→ 用 3,200 万潜在人群 + 女性消费升级反驳
  - “政策不确定”→ 强调健康赛道定位 + 医疗器械合作渠道
• 下一步：试点 3 城（沪/深/成都），投放 KOC + 小红书社区，用 6 周验证 3 个指标（CAC&lt;100、复购>1.5、订阅占比>25%）
---
需要我再生成路演稿或 KPI 看板的话继续招呼我。`;

      const SAMPLE_CONVERSATION_MESSAGES = [
        { role: "user", content: "哥们，帮我整份情趣用品市场调研，明天要和投资人对一下。" },
        { role: "assistant", content: "收到。先确认下，这份调研主要用在什么场景？比如融资路演、内部立项，还是其他？" },
        { role: "user", content: "准备投一款智能情侣玩具，需要给风险投资机构看。" },
        { role: "assistant", content: "明白。目标受众具体是谁？投资人里偏商业背景还是技术背景，他们更关心哪类信息？" },
        { role: "user", content: "25-35 岁一二线都市白领情侣，投资人偏商业，想看增长和付费意愿。" },
        { role: "assistant", content: "好的。展示形式有偏好吗？例如 PPT 提纲、长文档还是简报摘要？需要哪些地区或对比维度？" },
        { role: "user", content: "给我 PPT 大纲 + 要点数据，最好有北美和国内对比。" },
        { role: "assistant", content: "风格方面呢？比如正式/口语化，或者需要多 aggressive 的结论？" },
        { role: "user", content: "口语化但结论要狠，能打动VC。" },
        { role: "assistant", content: "最后确认细节深度：哪些指标必须量化？还有没有特定的隐私或合规点要提醒？" },
        { role: "user", content: "渗透率、客单价、复购、政策风险都要提，隐私合规简单提醒即可。" },
        { role: "assistant", content: SAMPLE_REPORT_CONTENT }
      ];

      // 会话数据存储
      const conversationsData = new Map();
      let currentConversationId = "conv-1";
      let isLoading = false;
      
      // 初始化现有会话数据
      document.querySelectorAll("[data-conversation-id]").forEach((item) => {
        const id = item.dataset.conversationId;
        if (id === "conv-1") {
          conversationsData.set(id, {
            title: "使用示例",
            messages: SAMPLE_CONVERSATION_MESSAGES.map((msg) => ({ ...msg }))
          });
        } else {
          conversationsData.set(id, {
            title: item.querySelector(".conversation-title").textContent.trim(),
            messages: []
          });
        }
      });

      const applyTheme = (theme) => {
        if (theme === "dark") {
          root.classList.add("dark");
          sunIcon.classList.add("hidden");
          moonIcon.classList.remove("hidden");
        } else {
          root.classList.remove("dark");
          sunIcon.classList.remove("hidden");
          moonIcon.classList.add("hidden");
        }
        localStorage.setItem("clarity-theme", theme);
      };

      const storedTheme = localStorage.getItem("clarity-theme") || "light";
      applyTheme(storedTheme);

      toggleBtn.addEventListener("click", () => {
        const nextTheme = root.classList.contains("dark") ? "light" : "dark";
        applyTheme(nextTheme);
      });

      const MAX_TITLE_LENGTH = 24;
      const PINNED_CLASSES = [
        "ring-2",
        "ring-amber-400",
        "bg-amber-50",
        "dark:bg-amber-400/10",
        "shadow-lg",
        "shadow-amber-500/30"
      ];
      document.querySelectorAll(".conversation-title").forEach((titleEl) => {
        titleEl.setAttribute("title", titleEl.textContent.trim());
      });

      // HTML 转义函数
      const escapeHtml = (text) => {
        const div = document.createElement("div");
        div.textContent = text;
        return div.innerHTML;
      };

      const applyInlineFormatting = (line) => {
        let safe = escapeHtml(line);
        safe = safe.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
        return safe;
      };

      const formatAssistantContent = (text) => {
        const normalized = text.replace(/^>\s?/gm, "");
        const lines = normalized.split(/\r?\n/);
        const htmlParts = [];
        let listBuffer = [];

        const flushList = () => {
          if (listBuffer.length) {
            htmlParts.push(`<ul class="list-disc pl-5 space-y-1 text-sm text-slate-700 dark:text-slate-100">${listBuffer.join("")}</ul>`);
            listBuffer = [];
          }
        };

        lines.forEach((line) => {
          const trimmed = line.trim();
          if (!trimmed) {
            flushList();
            return;
          }

          if (trimmed === "---") {
            flushList();
            htmlParts.push('<hr class="border-slate-200 dark:border-slate-700 my-3">');
            return;
          }

          if (/^(\d+[\.)]|[-•*])\s+/.test(trimmed)) {
            const content = trimmed.replace(/^(\d+[\.)]|[-•*])\s+/, "");
            listBuffer.push(`<li>${applyInlineFormatting(content)}</li>`);
          } else if (/^#+\s+/.test(trimmed)) {
            flushList();
            const level = trimmed.match(/^#+/)[0].length;
            const tag = `h${Math.min(level + 2, 6)}`;
            const heading = trimmed.replace(/^#+\s+/, "");
            htmlParts.push(`<${tag} class="font-semibold text-slate-800 dark:text-slate-100 mt-3 mb-1">${applyInlineFormatting(heading)}</${tag}>`);
          } else {
            flushList();
            htmlParts.push(`<p class="text-sm leading-relaxed text-slate-700 dark:text-slate-100 mb-2">${applyInlineFormatting(trimmed)}</p>`);
          }
        });

        flushList();

        if (!htmlParts.length) {
          return `<p class="text-sm leading-relaxed text-slate-700 dark:text-slate-100">${escapeHtml(text)}</p>`;
        }

        return htmlParts.join("");
      };

      // 显示加载状态
      const showLoadingIndicator = () => {
        const loadingDiv = document.createElement("div");
        loadingDiv.id = "loading-indicator";
        loadingDiv.className = "flex justify-start";
        loadingDiv.innerHTML = `
          <div class="max-w-xl rounded-2xl bg-slate-100 border border-slate-200 dark:bg-[#11182A] dark:border-white/5 px-4 py-3 text-slate-800 dark:text-slate-100 shadow-sm">
            <div class="flex items-center gap-2">
              <div class="flex gap-1">
                <div class="w-2 h-2 bg-slate-400 rounded-full animate-bounce" style="animation-delay: 0s"></div>
                <div class="w-2 h-2 bg-slate-400 rounded-full animate-bounce" style="animation-delay: 0.2s"></div>
                <div class="w-2 h-2 bg-slate-400 rounded-full animate-bounce" style="animation-delay: 0.4s"></div>
              </div>
              <span class="text-sm text-slate-500 dark:text-slate-400">AI 正在思考…</span>
            </div>
          </div>
        `;
        messageHistory.appendChild(loadingDiv);
        messageHistory.scrollTop = messageHistory.scrollHeight;
      };

      // 移除加载状态
      const removeLoadingIndicator = () => {
        const loadingIndicator = document.getElementById("loading-indicator");
        if (loadingIndicator) {
          loadingIndicator.remove();
        }
      };

      // 渲染消息
      const renderMessages = (messages, showLoading = false, streamOptions = null) => {
        messageHistory.innerHTML = "";

        messages.forEach((msg, index) => {
          const messageDiv = document.createElement("div");
          if (msg.role === "user") {
            messageDiv.className = "flex justify-end";
            messageDiv.innerHTML = `
              <div class="max-w-xl rounded-2xl bg-gradient-to-r from-blue-600 via-indigo-500 to-cyan-500 px-4 py-3 text-white shadow-xl shadow-blue-900/30">
                ${escapeHtml(msg.content)}
              </div>
            `;
          } else {
            messageDiv.className = "flex justify-start";
            const bubble = document.createElement("div");
            bubble.className =
              "max-w-xl rounded-2xl bg-white border border-slate-200 dark:bg-[#11182A] dark:border-white/5 px-5 py-4 text-slate-800 dark:text-slate-100 shadow-sm space-y-2";
            const contentEl = document.createElement("div");
            contentEl.className = "assistant-content space-y-2 text-sm leading-relaxed";
            bubble.appendChild(contentEl);
            messageDiv.appendChild(bubble);

            const shouldStream =
              streamOptions &&
              streamOptions.streamIndex === index &&
              streamOptions.streamText;

            if (shouldStream) {
              startTypingEffect(contentEl, streamOptions.streamText, () => {
                contentEl.innerHTML = formatAssistantContent(streamOptions.streamText);
              });
            } else {
              contentEl.innerHTML = formatAssistantContent(msg.content);
            }
          }
          messageHistory.appendChild(messageDiv);
        });

        if (showLoading) {
          showLoadingIndicator();
        }

        messageHistory.scrollTop = messageHistory.scrollHeight;
      };

      const cleanTypingText = (text) =>
        text
          .replace(/\*\*/g, "")
          .replace(/^>\s?/gm, "");

      const startTypingEffect = (element, fullText, onComplete) => {
        const text = cleanTypingText(fullText);
        let index = 0;
        const cursor = document.createElement("span");
        cursor.className = "ml-1 inline-block w-1 h-4 bg-slate-400 dark:bg-slate-300 animate-pulse align-middle";

        const step = () => {
          if (index <= text.length) {
            const current = escapeHtml(text.slice(0, index)).replace(/\n/g, "<br>");
            element.innerHTML = `<span>${current}</span>`;
            element.appendChild(cursor);
            index += 1;
            requestAnimationFrame(step);
          } else {
            cursor.remove();
            if (typeof onComplete === "function") {
              onComplete();
            }
          }
        };

        step();
      };

      // 调用OpenAI API
      const callOpenAI = async (messages, retries = 3) => {
        if (!OPENAI_API_KEY || OPENAI_API_KEY === "sk-your-api-key-here") {
          throw new Error("请先配置OpenAI API密钥");
        }

        const requestBody = {
          model: OPENAI_MODEL,
          messages: [
            { role: "system", content: SYSTEM_PROMPT },
            ...messages
          ],
          temperature: 0.7,
          max_tokens: 1000
        };

        for (let attempt = 1; attempt <= retries; attempt++) {
          try {
            const response = await fetch(OPENAI_API_URL, {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                "Authorization": `Bearer ${OPENAI_API_KEY}`
              },
              body: JSON.stringify(requestBody)
            });

            if (!response.ok) {
              const errorData = await response.json().catch(() => ({}));
              if (response.status === 429 && attempt < retries) {
                // 速率限制，等待后重试
                await new Promise(resolve => setTimeout(resolve, 1000 * attempt));
                continue;
              }
              throw new Error(errorData.error?.message || `API错误: ${response.status} ${response.statusText}`);
            }

            const data = await response.json();
            const assistantMessage = data.choices[0]?.message?.content;
            
            if (!assistantMessage) {
              throw new Error("API返回格式错误");
            }

            return assistantMessage;
          } catch (error) {
            if (attempt === retries) {
              throw error;
            }
            // 网络错误，等待后重试
            if (error.name === "TypeError" || error.message.includes("fetch")) {
              await new Promise(resolve => setTimeout(resolve, 1000 * attempt));
              continue;
            }
            throw error;
          }
        }
      };

      // 切换会话
      const switchConversation = (conversationId) => {
        currentConversationId = conversationId;
        const conversation = conversationsData.get(conversationId);
        if (!conversation) return;

        // 更新标题
        conversationTitle.textContent = conversation.title;

        // 更新活跃状态
        clearActiveConversationSelection();
        const activeItem = document.querySelector(`[data-conversation-id="${conversationId}"]`);
        if (activeItem) {
          activeItem.classList.add("ring-2", "ring-blue-400", "bg-blue-50", "dark:bg-blue-500/10");
        }

        // 显示消息或欢迎界面
        if (conversation.messages.length > 0) {
          welcomeScreen.classList.add("hidden");
          messageHistory.classList.remove("hidden");
          renderMessages(conversation.messages);
        } else {
          welcomeScreen.classList.remove("hidden");
          messageHistory.classList.add("hidden");
        }
      };

      // 添加消息
      const addMessage = (role, content, skipAPI = false) => {
        // 如果没有当前会话且是用户消息，先创建新会话
        if (!currentConversationId && role === "user") {
          const derivedTitle = getConversationTitleFromMessage(content);
          const newItem = createConversationItem(derivedTitle);
          conversationList?.prepend(newItem);
          currentConversationId = newItem.dataset.conversationId;
          switchConversation(currentConversationId);
        }

        const conversation = conversationsData.get(currentConversationId);
        if (!conversation) return;

        conversation.messages.push({ role, content });
        conversationsData.set(currentConversationId, conversation);

        // 如果当前是欢迎界面，切换到消息界面
        if (welcomeScreen && !welcomeScreen.classList.contains("hidden")) {
          welcomeScreen.classList.add("hidden");
          messageHistory.classList.remove("hidden");
        }

        // 如果是用户消息且不跳过API调用，则调用OpenAI
        if (role === "user" && !skipAPI && !isLoading) {
          renderMessages(conversation.messages, true);
          getAIResponse(conversation.messages);
        } else {
          renderMessages(conversation.messages);
        }
      };

      // 获取AI回复
      const getAIResponse = async (messages) => {
        if (isLoading) return;
        
        isLoading = true;
        setSendButtonLoading(true);

        try {
          const assistantMessage = await callOpenAI(messages);
          const conversation = conversationsData.get(currentConversationId);
          if (conversation) {
            conversation.messages.push({ role: "assistant", content: assistantMessage });
            conversationsData.set(currentConversationId, conversation);
            renderMessages(conversation.messages, false, {
              streamIndex: conversation.messages.length - 1,
              streamText: assistantMessage
            });
          }
        } catch (error) {
          console.error("API调用错误:", error);
          removeLoadingIndicator();
          
          // 显示错误消息
          const errorMessage = error.message || "获取AI回复失败，请稍后重试";
          const conversation = conversationsData.get(currentConversationId);
          if (conversation) {
            // 添加错误消息到对话中
            const errorDiv = document.createElement("div");
            errorDiv.className = "flex justify-start";
            errorDiv.innerHTML = `
              <div class="max-w-xl rounded-2xl bg-red-50 border border-red-200 dark:bg-red-900/20 dark:border-red-800 px-4 py-3 text-red-700 dark:text-red-400 shadow-sm">
                <div class="flex items-center gap-2">
                  <span>⚠️</span>
                  <span>${escapeHtml(errorMessage)}</span>
                </div>
                <button class="mt-2 text-sm text-red-600 dark:text-red-400 hover:underline retry-btn" data-retry="true">
                  重新发送
                </button>
              </div>
            `;
            messageHistory.appendChild(errorDiv);
            messageHistory.scrollTop = messageHistory.scrollHeight;

            // 添加重试按钮事件
            const retryBtn = errorDiv.querySelector(".retry-btn");
            retryBtn.addEventListener("click", () => {
              errorDiv.remove();
              getAIResponse(conversation.messages);
            });
          }
        } finally {
          isLoading = false;
          setSendButtonLoading(false);
        }
      };
      const newConversationBtn = document.getElementById("newConversationBtn");
      let conversationSequence =
        document.querySelectorAll(".conversation-item").length;
      const closeMenus = () => {
        document.querySelectorAll(".more-menu-panel").forEach((panel) => {
          panel.classList.add("hidden");
        });
      };

      const normalizeTitle = (raw, fallback = "未命名会话") => {
        let nextValue = (raw || "")
          .toString()
          .replace(/\s+/g, " ")
          .trim();
        if (!nextValue) {
          nextValue = fallback;
        }
        if (nextValue.length > MAX_TITLE_LENGTH) {
          nextValue = nextValue.slice(0, MAX_TITLE_LENGTH);
        }
        return nextValue;
      };

      const getConversationTitleFromMessage = (text) => normalizeTitle(text, "新对话");

      const clearActiveConversationSelection = () => {
        document.querySelectorAll(".conversation-item").forEach((item) => {
          item.classList.remove("ring-2", "ring-blue-400", "bg-blue-50", "dark:bg-blue-500/10");
        });
      };

      const showWelcomeView = () => {
        currentConversationId = null;
        conversationTitle.textContent = "欢迎使用 Clarity AI";
        welcomeScreen?.classList.remove("hidden");
        messageHistory?.classList.add("hidden");
        if (messageHistory) {
          messageHistory.innerHTML = "";
        }
        clearActiveConversationSelection();
      };

      const setSendButtonLoading = (isSending) => {
        const button = sendForm?.querySelector("button[type='submit']");
        if (!button) return;
        button.disabled = isSending;
        button.classList.toggle("opacity-60", isSending);
        button.classList.toggle("cursor-not-allowed", isSending);
      };

      const enableInlineRename = (conversationItem) => {
        if (!conversationItem) return;
        const titleEl = conversationItem.querySelector(".conversation-title");
        if (!titleEl || titleEl.dataset.editing === "true") {
          return;
        }

        const originalText = titleEl.textContent.trim();
        titleEl.dataset.editing = "true";
        titleEl.contentEditable = "true";
        titleEl.classList.add(
          "outline-none",
          "ring-2",
          "ring-blue-400",
          "rounded-lg",
          "px-1",
          "bg-white",
          "dark:bg-white/10"
        );

        const range = document.createRange();
        range.selectNodeContents(titleEl);
        const selection = window.getSelection();
        selection.removeAllRanges();
        selection.addRange(range);
        titleEl.focus();

        const finishEditing = (revert = false) => {
          titleEl.dataset.editing = "false";
          titleEl.contentEditable = "false";
          titleEl.classList.remove(
            "ring-2",
            "ring-blue-400",
            "rounded-lg",
            "px-1",
            "bg-white",
            "dark:bg-white/10"
          );

          const nextValue = normalizeTitle(
            revert ? originalText : titleEl.textContent,
            originalText
          );
          titleEl.textContent = nextValue;
          titleEl.setAttribute("title", nextValue);
          
          // 更新会话数据
          const conversationId = conversationItem.dataset.conversationId;
          const conversation = conversationsData.get(conversationId);
          if (conversation) {
            conversation.title = nextValue;
            conversationsData.set(conversationId, conversation);
            if (currentConversationId === conversationId) {
              conversationTitle.textContent = nextValue;
            }
          }
          
          titleEl.removeEventListener("blur", handleBlur);
          titleEl.removeEventListener("keydown", handleKeyDown);
        };

        const handleBlur = () => finishEditing();
        const handleKeyDown = (event) => {
          if (event.key === "Enter") {
            event.preventDefault();
            finishEditing();
          } else if (event.key === "Escape") {
            event.preventDefault();
            finishEditing(true);
          }
        };

        titleEl.addEventListener("blur", handleBlur);
        titleEl.addEventListener("keydown", handleKeyDown);
      };

      const getNextConversationSequence = () => {
        conversationSequence += 1;
        return conversationSequence;
      };

      const createConversationItem = (title) => {
        const seq = getNextConversationSequence();
        const wrapper = document.createElement("div");
        const conversationId = `conv-${Date.now()}-${seq}`;
        wrapper.dataset.conversationId = conversationId;
        wrapper.dataset.pinned = "false";
        wrapper.className =
          "conversation-item relative rounded-xl border border-slate-200 dark:border-white/5 dark:bg-white/5 dark:text-slate-100 p-3 hover:border-blue-400 cursor-pointer transition group";
        const safeTitle = normalizeTitle(title, `新对话`);

        wrapper.innerHTML = `
          <span class="conversation-title block pr-6 text-sm font-medium text-slate-800 dark:text-white truncate" title="${safeTitle}">${safeTitle}</span>
          <button class="absolute right-2 top-1.5 rounded-full px-2 py-1 text-slate-400 hover:text-slate-900 hover:bg-slate-100 dark:hover:bg-white/10 dark:hover:text-white more-menu-btn" aria-label="更多">⋮</button>
          <div class="absolute right-2 top-8 z-20 hidden w-32 rounded-xl border border-slate-200 dark:border-white/10 bg-white dark:bg-[#11182A] shadow-xl more-menu-panel">
            <button data-action="rename" class="w-full px-4 py-2 text-left text-xs text-slate-600 hover:bg-slate-100 dark:text-slate-200 dark:hover:bg-white/10">重命名</button>
            <button data-action="pin" class="pin-btn w-full px-4 py-2 text-left text-xs text-slate-600 hover:bg-slate-100 dark:text-slate-200 dark:hover:bg-white/10">
              <span data-pin-label>置顶</span>
            </button>
            <button data-action="delete" class="w-full px-4 py-2 text-left text-xs text-red-500 hover:bg-red-50 dark:hover:bg-red-500/10">删除</button>
          </div>
        `;

        // 初始化会话数据
        conversationsData.set(conversationId, {
          title: safeTitle,
          messages: []
        });

        return wrapper;
      };

      const setPinnedState = (conversationItem, isPinned) => {
        conversationItem.dataset.pinned = String(isPinned);
        const pinLabel = conversationItem.querySelector("[data-pin-label]");

        PINNED_CLASSES.forEach((cls) => {
          if (isPinned) {
            conversationItem.classList.add(cls);
          } else {
            conversationItem.classList.remove(cls);
          }
        });

        if (pinLabel) {
          pinLabel.textContent = isPinned ? "取消置顶" : "置顶";
        }
      };

      document.addEventListener("click", () => closeMenus());

      conversationList?.addEventListener("click", (event) => {
        const menuBtn = event.target.closest(".more-menu-btn");
        if (menuBtn) {
          event.stopPropagation();
          const panel = menuBtn.nextElementSibling;
          const isHidden = panel.classList.contains("hidden");
          closeMenus();
          if (isHidden) {
            panel.classList.remove("hidden");
          }
          return;
        }

        const actionBtn = event.target.closest("[data-action]");
        if (!actionBtn) {
          return;
        }

        event.stopPropagation();
        const action = actionBtn.dataset.action;
        const conversationItem = actionBtn.closest("[data-conversation-id]");
        const titleEl = conversationItem.querySelector(".conversation-title");
        const currentTitle = titleEl.textContent.trim();
        const isPinned = conversationItem.dataset.pinned === "true";

        if (action === "rename") {
          enableInlineRename(conversationItem);
        } else if (action === "pin") {
          const nextPinned = !isPinned;
          setPinnedState(conversationItem, nextPinned);
          if (nextPinned) {
            conversationList.prepend(conversationItem);
          } else {
            conversationList.appendChild(conversationItem);
          }
        } else if (action === "delete") {
          const confirmDelete = confirm(`确定删除会话"${currentTitle}"吗？`);
          if (confirmDelete) {
            const conversationId = conversationItem.dataset.conversationId;
            conversationsData.delete(conversationId);
            if (currentConversationId === conversationId) {
              // 如果删除的是当前会话，切换到第一个会话
              const firstItem = conversationList.querySelector(".conversation-item");
              if (firstItem) {
                switchConversation(firstItem.dataset.conversationId);
              } else {
                showWelcomeView();
              }
            }
            conversationItem.remove();
          }
        }

        closeMenus();
      });

      // 新建会话
      newConversationBtn?.addEventListener("click", () => {
        closeMenus();
        removeLoadingIndicator();
        isLoading = false;
        setSendButtonLoading(false);
        messageInput.value = "";
        showWelcomeView();
      });

      // 会话项点击事件
      conversationList?.addEventListener("click", (event) => {
        const conversationItem = event.target.closest(".conversation-item");
        if (conversationItem && !event.target.closest(".more-menu-btn") && !event.target.closest("[data-action]")) {
          const conversationId = conversationItem.dataset.conversationId;
          switchConversation(conversationId);
        }
      });

      // 输入框回车发送（Shift+Enter换行）
      messageInput?.addEventListener("keydown", (event) => {
        if (event.key === "Enter" && !event.shiftKey) {
          event.preventDefault();
          if (!isLoading) {
            sendForm?.requestSubmit();
          }
        }
      });

      // 示例问题点击事件
      document.addEventListener("click", (event) => {
        const exampleBtn = event.target.closest(".example-question");
        if (exampleBtn && !isLoading) {
          const question = exampleBtn.dataset.question;
          if (question) {
            addMessage("user", question);
          }
        }
      });

      // 消息发送事件
      sendForm?.addEventListener("submit", (event) => {
        event.preventDefault();
        if (isLoading) return;
        
        const content = messageInput.value.trim();
        if (!content) return;

        addMessage("user", content);
        messageInput.value = "";
      });


      // 初始化：显示欢迎界面
      showWelcomeView();
    </script>
  </body>
</html>
